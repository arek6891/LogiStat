# Kontrola kazdego PR i pushu na main: testy na Postgresie, pyright, skladnia JS.
# Te same wersje co produkcja (Dockerfile: python:3.11) i baza (postgres:16).
name: Testy

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: testy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: logistat
          POSTGRES_PASSWORD: logistat
          POSTGRES_DB: logistat_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U logistat -d logistat_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # conftest.py domyslnie laczy sie z 127.0.0.1:55432/logistat_test.
      - run: pytest -q

  pyright:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: npx --yes pyright@1.1.414

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Bez testow JS — przynajmniej blad skladni w static/*.js nie przejdzie.
      - run: for f in static/js/*.js; do node --check "$f" || exit 1; done
