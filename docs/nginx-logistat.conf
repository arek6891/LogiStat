# =============================================================================
# LogiStat — Nginx reverse proxy
# Domena: logistat.logwin-logistics.com
#
# Aktualny stan: HTTP (czekamy na certyfikaty SSL od IT)
# Po otrzymaniu certyfikatów: odkomentować blok HTTPS, zakomentować blok HTTP
#
# Przeładowanie po zmianie:
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# ── TYMCZASOWY HTTP (do czasu otrzymania certyfikatów od IT) ─────────────────
server {
    listen 80;
    server_name logistat.logwin-logistics.com;

    location / {
        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout    120s;
        proxy_connect_timeout  10s;
        proxy_send_timeout    120s;
        client_max_body_size  50M;
    }

    access_log /var/log/nginx/logistat_access.log;
    error_log  /var/log/nginx/logistat_error.log;
}

